services:
  postgres:
    image: postgres:16
    container_name: cashew-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      METASTORE_USER: ${METASTORE_USER:?set METASTORE_USER in .env}
      METASTORE_PASSWORD: ${METASTORE_PASSWORD:?set METASTORE_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  hive-metastore:
    image: apache/hive:4.0.1
    container_name: cashew-hive-metastore
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=${METASTORE_USER}
        -Djavax.jdo.option.ConnectionPassword=${METASTORE_PASSWORD}
        -Dhive.metastore.warehouse.dir=/home/ashwin/Projects/cashew-pysaprk/data
    volumes:
      - ./libs/postgresql-42.7.13.jar:/opt/hive/lib/postgres.jar
      - /home/ashwin/Projects/cashew-pysaprk/data:/home/ashwin/Projects/cashew-pysaprk/data
    ports:
      - "127.0.0.1:9083:9083"

volumes:
  pgdata:
