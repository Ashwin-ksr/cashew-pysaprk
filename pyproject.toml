[project]
name = "cashew"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "delta-spark>=4.4.0",
    "ipykernel>=7.4.0",
    "pandas>=2.2,<3",
    "pyspark>=4.2.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
cashew = "cashew:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/cashew"]
