[project]
name = "cashew"
version = "0.1.0"
description = "A local Python ETL project for loading monthly transaction data from Cashew into Spark, transforming it, and preparing analytics-ready data for dashboards."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "delta-spark>=4.4.0",
    "ipykernel>=7.4.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2,<3",
    "pyarrow>=25.0.1",
    "pyspark>=4.2.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
cashew = "cashew:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/cashew"]

[dependency-groups]
dev = [
    "apache-airflow-task-sdk==1.3.2",
]
